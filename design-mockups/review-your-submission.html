<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primble Review Redesign</title>
<style>
/* ---------- Live tokens (frontend/src/App.css) ---------- */
:root{
  --primary:#E61B84; --primary-dark:#C0157A;
  --text-primary:#0b0b0b; --text-secondary:#6a6a6a;
  --radius-md:12px; --radius-full:999px;
  --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155; --slate-600:#475569; --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9; --slate-50:#f8fafc;
  /* rail (new element) */
  --rail-bg:#0B0B0F; --rail-line:#1F1F24; --rail-text:#A1A1AA; --rail-group:#8B8B94; --rail-active:rgba(230,27,132,.16);
  --rail-w:248px; --hdr-h:77px; --hdr-offset:77px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:#f8fafc;color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg{flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- App header (components/layout/Header.jsx) ---------- */
.landing-header{display:flex;justify-content:space-between;align-items:center;padding:20px 56px;border-bottom:1px solid rgba(0,0,0,.06);background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px 0 rgba(0,0,0,.12),0 8px 28px 0 rgba(0,0,0,.18);transition:transform .3s ease}
.landing-header.hidden{transform:translateY(-100%)}
.header-left{display:flex;align-items:center;gap:36px}
.logo{cursor:pointer;line-height:1}
.logo img{height:28px;width:auto;display:block}
.header-right{display:flex;align-items:center;gap:10px}
.dl-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 6px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1;color:#b45309}
.dl-pill:hover{color:#0f172a}
.header-dashboard-btn{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;border:1px solid rgba(230,27,132,.35);background:rgba(230,27,132,.08);color:var(--primary);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;line-height:1}
.header-dashboard-btn:hover{color:#C0157A}
.udrop-trigger{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1.5px solid #e2e8f0;border-radius:999px;background:#fff;color:#0f172a;transition:border-color .2s,box-shadow .2s}
.udrop-trigger:hover{border-color:#cbd5e1;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.udrop-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ---------- Shell ---------- */
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - var(--hdr-h))}
.shell.no-rail .rail{display:none}
.rail{position:sticky;top:var(--hdr-offset);height:calc(100vh - var(--hdr-offset));width:var(--rail-w);flex-shrink:0;background:var(--rail-bg);color:var(--rail-text);display:flex;flex-direction:column;transition:top .3s ease,height .3s ease;z-index:30}
.rail-pkg{margin:18px 14px 2px;padding:10px 12px;border:1px solid var(--rail-line);border-radius:10px;background:#111116}
.rail-pkg-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-group);font-weight:600;line-height:1.4}
.rail-pkg-name{color:#E4E4E7;font-weight:600;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.rail-nav{flex:1;overflow-y:auto;padding:4px 0 12px}
.nav-group{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-group);font-weight:600;padding:20px 22px 8px;line-height:1.3}
.nav-item{position:relative;display:flex;align-items:center;gap:11px;width:calc(100% - 16px);margin:1px 8px;height:40px;padding:0 10px 0 14px;border:0;border-radius:8px;background:none;color:var(--rail-text);font-weight:500;font-size:14px;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:#17171C;color:#E4E4E7}
.nav-item.active{background:var(--rail-active);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav-label{flex:1;white-space:nowrap}
.nbadge{min-width:22px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.nbadge-grey{background:#27272A;color:#D4D4D8}
.nbadge-done{padding:0;width:22px}
.nbadge-done svg{display:block;stroke-width:3}
.rail-foot{border-top:1px solid var(--rail-line);padding:16px 22px 18px}
.rf-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-group);font-weight:600;line-height:1.4}
.rf-tier{font-size:15px;font-weight:700;margin-top:3px;line-height:1.4}
.rf-sub{font-size:12.5px;color:var(--rail-text);line-height:1.4}
.rf-bar{height:4px;border-radius:999px;background:#27272A;margin-top:10px;overflow:hidden}
.rf-bar>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .4s ease}
.rf-reset{margin-top:10px;font-size:11.5px;color:var(--rail-group);text-decoration:underline;text-underline-offset:2px;background:none;border:0}
.rf-reset:hover{color:#D4D4D8}

.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - var(--hdr-h))}
.acord-step-shell{padding:32px 40px;flex:1}
.modal-step{max-width:600px;margin:0 auto}
.modal-step-wide{max-width:1000px}
.pane-anim{animation:fadeIn .2s ease}

/* ---------- Live step styles ---------- */
.step-header{text-align:center;margin-bottom:28px}
.step-title{font-size:32px;font-weight:700;margin-bottom:8px;color:#1e293b;line-height:1.25}
.step-subtitle{color:var(--text-secondary);font-size:15px}
.status-pill{display:inline-flex;align-items:center;margin-top:12px;height:24px;padding:0 11px;border-radius:999px;font-size:11.5px;font-weight:700;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe}
.btn{padding:14px 28px;border-radius:var(--radius-md);font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-modal-primary{background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(230,27,132,.3)}
.btn-modal-primary:hover:not(:disabled){background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 6px 24px rgba(230,27,132,.4)}
.btn-modal-secondary{background:rgba(230,27,132,.1);color:var(--primary);border:1px solid var(--primary)}
.btn-modal-secondary:hover:not(:disabled){background:rgba(230,27,132,.15)}
.btn-block{width:100%}
.btn-large{padding:14px 24px;font-size:16px;font-weight:700}

.tier2-bar{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 18px;margin-bottom:14px}
.tier2-header{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-bottom:10px}
.tier2-label{font-size:13px;font-weight:600;color:var(--text-primary)}
.tier2-status{font-size:16px;font-weight:800;line-height:1.2}
.tier2-detail{font-size:12px;color:var(--text-secondary);margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.tier2-detail-ok{color:#166534}
.tier2-missing{font-size:12px;color:var(--text-secondary);margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.tier2-hint{font-size:12px;color:var(--text-secondary)}

.ov-grid{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.ov-grid .tier2-bar{margin-bottom:0}
.ready{display:flex;gap:22px;align-items:center}
.gauge{width:210px;flex-shrink:0;text-align:center}
.gauge svg{display:block;width:100%;height:auto}
.gauge path{transition:opacity .35s ease}
.gauge-tier{font-size:20px;font-weight:800;margin-top:-4px;line-height:1.2}
.ready-big{font-size:13px;font-weight:600;color:#1e293b}
.ready-note{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.5}
.ladder{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.ladder-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#64748b;line-height:1.5}
.ladder-row i{width:8px;height:8px;border-radius:50%;background:#e2e8f0}
.ladder-row.on{color:#0f172a;font-weight:700}
.prog-big{display:flex;align-items:baseline;gap:8px}
.prog-big b{font-size:30px;font-weight:800;color:#1e293b;letter-spacing:-.01em;line-height:1.2}
.prog-big span{font-size:13px;color:var(--text-secondary)}
.prog-bar{height:6px;border-radius:999px;background:#eef2f7;overflow:hidden;margin-top:10px}
.prog-bar>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .45s ease}
.stats{list-style:none;margin-top:12px;display:grid;gap:4px}
.stats li{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#334155}
.stats li i{width:7px;height:7px;border-radius:50%}
.stats li.done{color:#94a3b8}

.review-section{background:#fff;border:1px solid #e2e8f0;border-radius:var(--radius-md);padding:14px 16px;margin-bottom:14px}
.doc-summary{margin-bottom:20px}
.cs-head{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;padding:3px 0;cursor:pointer;text-align:left;line-height:1.6}
.cs-chev{font-size:8px;color:#94a3b8;display:inline-block;transition:transform .15s;flex-shrink:0}
.cs-head[aria-expanded="true"] .cs-chev{transform:rotate(90deg)}
.cs-title{font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:inline-flex;align-items:center;gap:3px;min-width:0;flex-wrap:wrap}
.cs-right{margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.cs-body{margin-top:6px}
.doc-type-badge{text-transform:capitalize;font-weight:600;color:var(--primary);font-size:11px;padding:2px 8px;background:rgba(230,27,132,.1);border-radius:999px;white-space:nowrap;line-height:1.6}
.doc-filename{color:var(--text-secondary)}
.mini-btn{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;color:#475569;display:inline-flex;align-items:center;gap:4px;justify-content:center;line-height:1.5}
.mini-btn:hover{background:#f8fafc}

.stops-banner{border-radius:var(--radius-md);padding:16px 20px;background:rgba(230,27,132,.07);border:1.5px solid rgba(230,27,132,.25);margin-bottom:14px}
.stops-title{font-size:12.5px;font-weight:800;margin-bottom:12px;color:#1e293b;letter-spacing:.06em;text-transform:uppercase;line-height:1.5}
.stops-title-meta{display:block;margin-top:3px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:none;color:#64748b}
.stops-progress{display:block;margin-top:4px;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none}
.stop-item{font-size:13px;padding:5px 0 5px 15px;text-indent:-15px;line-height:1.55;color:#1e293b}
.issue-card{background:#fff;border:1px solid rgba(230,27,132,.18);border-radius:10px;padding:11px 13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.issue-card:last-child{margin-bottom:0}
.issue-card-actions{margin-top:9px;padding-top:8px;border-top:1px solid #f1f5f9}
.issue-card-item+.issue-card-item{margin-top:9px;padding-top:9px;border-top:1px solid #f1f5f9}
.issue-count{display:inline-block;font-size:9px;font-weight:700;line-height:1.6;color:#64748b;background:#f1f5f9;border-radius:8px;padding:0 6px;margin-left:6px;letter-spacing:0;vertical-align:1px}
.issue-bullet{font-weight:700;font-size:1.3em;line-height:0;position:relative;top:1px}
.warning-important-section{margin-bottom:14px}
.issue-status-btn{font-size:10px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;border:1px solid #e2e8f0;background:#fff;color:#475569;transition:background .12s,border-color .12s;line-height:1.6}
.issue-status-btn:hover{background:#f8fafc;border-color:#cbd5e1}
.issue-status-btn-reopen{color:#94a3b8}
.pink-btn{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 9px;border-radius:6px;border:1px solid #f9a8d4;background:#fdf2f8;color:#be185d;white-space:nowrap;line-height:1.6}
.pink-btn:hover{background:#fce7f3}
.status-chip{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;line-height:1.6}
.rollup{font-size:9px;font-weight:700;color:#166534;background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:1px 7px;white-space:nowrap;line-height:1.6}
.wtabs{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 14px}
.wtab{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 12px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;color:#475569;font-size:12px;font-weight:600;white-space:nowrap}
.wtab:hover{border-color:#cbd5e1}
.wtab.on{border-color:rgba(230,27,132,.35);background:rgba(230,27,132,.08);color:var(--primary)}
.wtab.on .issue-count{background:rgba(230,27,132,.14);color:#9d0f5a}

/* ---------- Footer (live .step-footer-actions, pinned) ---------- */
.step-footer-actions{position:sticky;bottom:0;z-index:20;padding:10px 40px calc(10px + env(safe-area-inset-bottom));background:rgba(248,250,252,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid #e2e8f0}
.step-footer-inner{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.step-footer-note{font-size:12px;color:#64748b;text-align:center;line-height:1.5}

/* ---------- Tooltip, toast, modal ---------- */
.tip{position:fixed;z-index:100001;background:#1e293b;color:#fff;font-size:11px;font-weight:500;line-height:1.45;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.28);max-width:260px;pointer-events:none;display:none}
.tip.show{display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--ftr, 0px) + 16px);transform:translate(-50%,12px);width:max-content;max-width:calc(100vw - 32px);background:#1e293b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(15,23,42,.25);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,transform .2s,visibility 0s linear .2s;z-index:100002;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);pointer-events:auto;transition-delay:0s}
.toast button{color:#F9A8D4;font-weight:700;background:none;border:0;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px}
.mcard{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.mcard.anim{animation:slideUp .2s ease-out}
.m-err{color:#b91c1c;font-size:12.5px;margin-top:10px}
.res-hint{font-size:11.5px;color:#64748b;font-style:italic;margin-top:6px}
.st{border:1px solid #e2e8f0;border-radius:10px;padding:10px;background:#fbfcfe}
.st-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.st-count{font-size:12px;font-weight:700;color:#0f172a}
.st-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.st-btn{padding:7px 13px;font-size:12px;font-weight:600;border-radius:7px;border:1px solid #cbd5e1;background:#fff;color:#334155}
.st-btn.pri{border:none;background:#E61B84;color:#fff}
.st-empty{padding:18px 12px;text-align:center;color:#64748b;font-size:12.5px}
.st-table{border-collapse:separate;border-spacing:0 4px;width:100%;min-width:520px}
.st-table th{font-size:10.5px;color:#475569;font-weight:700;text-align:left;padding:0 4px;white-space:nowrap}
.st-table .num{width:30px;font-size:11px;color:#94a3b8;font-weight:600;padding:0 4px}
.st-table td{padding:0 4px;vertical-align:middle}
.st-cell{width:100%;padding:5px 7px;font-size:12px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;outline:none}
.st-cell:focus{border-color:#E61B84;box-shadow:0 0 0 3px rgba(230,27,132,.12)}
.st-rm{border:none;background:none;color:#94a3b8;font-size:16px;line-height:1;padding:2px 4px}
.mcard.wide{max-width:760px}
.m-close{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--primary);background:rgba(230,27,132,.1);color:var(--primary);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .2s}
.m-close:hover{background:var(--primary);color:#fff;transform:rotate(90deg)}
.m-input{width:100%;padding:9px 11px;font-size:13px;border:1px solid #e2e8f0;border-radius:8px;outline:none;background:#fff}
.m-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(230,27,132,.12)}
.m-primary{padding:9px 16px;border-radius:9px;border:none;background:var(--primary);color:#fff;font-size:13px;font-weight:700}
.m-primary:disabled{opacity:.5;cursor:not-allowed}
.m-ghost{padding:9px 16px;border-radius:9px;border:1px solid #e2e8f0;background:#f8fafc;color:#475569;font-size:13px;font-weight:600}

/* ---------- Responsive ---------- */
@media (max-width:1200px){.acord-step-shell{padding:28px 28px}.step-footer-actions{padding-left:28px;padding-right:28px}}
@media (max-width:1100px){.ov-grid{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{flex-direction:column;align-items:stretch}
  .rail{position:sticky;top:var(--hdr-offset);width:100%;height:auto;flex-direction:row;align-items:center;overflow:hidden}
  .rail-pkg,.rail-foot,.nav-group{display:none}
  .rail-nav{display:flex;overflow-x:auto;padding:8px;gap:4px;scrollbar-width:none;min-width:0}
  .rail-nav::-webkit-scrollbar{display:none}
  .nav-item{width:auto;margin:0;height:36px;padding:0 12px;flex-shrink:0}
  .nav-item.active::before{left:12px;right:12px;top:auto;bottom:-8px;width:auto;height:3px;border-radius:3px 3px 0 0}
  .main{min-height:0}
  .ready{flex-direction:column;align-items:stretch}.gauge{margin:0 auto}
}
@media (max-width:768px){
  .landing-header{padding:12px 16px}.header-left{gap:8px}
  .acord-step-shell{padding:24px 16px}
  .step-footer-actions{padding-left:16px;padding-right:16px}
  .step-title{font-size:26px}
}
@media (max-width:480px){
  .dl-pill{display:none}
  .acord-step-shell{padding:20px 12px}
  .stops-banner{padding:13px 14px}
  .tier2-bar{padding:12px 14px}
  .review-section{padding:12px}
  .step-title{font-size:24px}
}
@media (max-width:380px){.landing-header{padding:10px 12px}}
@media (max-width:480px){.gate-row{flex-direction:column!important}.gate-row .btn{flex:1 1 auto!important;white-space:normal!important}}

/* =====================================================================
   v3 - one connected section system (live palette only)
   ===================================================================== */
/* ---------- Rail ---------- */
.rail-pkg{margin:16px 14px 4px;padding:12px;display:flex;align-items:center;gap:11px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:linear-gradient(180deg,#18181E 0%,#111116 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.35)}
.rail-pkg-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:rgba(230,27,132,.16);border:1px solid rgba(230,27,132,.4);color:#F9A8D4;font-size:12.5px;font-weight:800;letter-spacing:.02em}
.rail-pkg-text{min-width:0;flex:1}
.rail-pkg-label{font-size:10px;letter-spacing:.1em}
.rail-pkg-name{font-size:13.5px;margin-top:1px;color:#FAFAFA}
.rail-pkg-meta{font-size:11.5px;color:var(--rail-text);line-height:1.4;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-nav{display:flex;flex-direction:column;gap:4px;padding:2px 0 12px}
.nav-group{padding:20px 22px 6px}
.nav-item{height:auto;min-height:56px;padding:9px 12px 9px 16px;gap:12px;border-radius:10px;margin:0 8px;width:calc(100% - 16px)}
.nav-item.active::before{top:12px;bottom:12px}
.nav-text{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.nav-label{font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap}
.nav-sub{font-size:11.5px;font-weight:500;line-height:1.35;margin-top:2px;color:var(--rail-group);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-item.active .nav-sub{color:#D4D4D8}
.rail-foot{margin:8px 14px 16px;padding:14px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:#111116}

/* ---------- Section frame ---------- */
.sec{display:flex;flex-direction:column;gap:14px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e2e8f0}
.page-head-text{min-width:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#E61B84;line-height:1.4}
.page-title{font-size:24px;font-weight:700;color:#1e293b;line-height:1.25;letter-spacing:-.01em;margin-top:4px}
.page-desc{font-size:14px;color:#64748b;line-height:1.5;margin-top:4px;max-width:640px}
.page-head-right{flex-shrink:0;display:flex;align-items:center;gap:8px;padding-bottom:2px}
.badge{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid;line-height:1.3}
.badge-pink{color:#9d0f5a;background:rgba(230,27,132,.10);border-color:rgba(230,27,132,.30)}
.badge-green{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
.badge-blue{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.badge-slate{color:#475569;background:#f1f5f9;border-color:#e2e8f0}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.04);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid #f1f5f9;background:#fff}
.panel-head:last-child{border-bottom:0}
.panel-head-text{min-width:0;flex:1}
.panel-title{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;font-weight:600;color:#1e293b;line-height:1.4}
.panel-meta{font-size:12px;color:#64748b;line-height:1.45;margin-top:2px}
.panel-right{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
.panel-body{padding:16px 18px}
.panel-rows > * + *{border-top:1px solid #f1f5f9}
button.panel-head{width:100%;border:0;border-bottom:1px solid #f1f5f9;text-align:left;cursor:pointer;font:inherit;color:inherit}
button.panel-head:last-child{border-bottom:0}
button.panel-head:hover{background:#f8fafc}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 18px;gap:6px}
.empty-ico{width:40px;height:40px;border-radius:50%;background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a;display:grid;place-items:center;margin-bottom:4px}
.empty-title{font-size:14px;font-weight:600;color:#1e293b}
.empty-sub{font-size:12.5px;color:#64748b}

/* ---------- Overview ---------- */
.ready{padding:2px 0}
.stats{margin-top:12px;gap:2px}
.stat-link{display:flex;align-items:center;gap:10px;margin:0 -10px;width:calc(100% + 20px);padding:8px 10px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;font-size:13px;color:#334155;transition:background .15s,border-color .15s}
.stat-link:hover{background:#f8fafc;border-color:#e2e8f0}
.stat-link i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat-link .go{margin-left:auto;color:#94a3b8;display:inline-flex}
.stat-link.done{color:#94a3b8}

/* ---------- Documents ---------- */
.doc-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;transition:background .15s}
.doc-row.is-excluded{background:#f8fafc}
.doc-row.is-excluded .doc-main,.doc-row.is-excluded .doc-ico{opacity:.6}
.doc-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:rgba(230,27,132,.08);color:#E61B84}
.doc-main{flex:1;min-width:180px}
.doc-name{font-size:14px;font-weight:600;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.doc-note{font-size:11px;color:#64748b;font-style:italic}
.doc-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.doc-actions select{font-size:12px;padding:4px 6px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer}
.mini-btn{font-size:11.5px;padding:4px 9px}

/* ---------- Submission Integrity ---------- */
.entity-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.entity-chip{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600}
.reason-list{margin:12px 0 0;padding-left:18px}
.reason-list li{font-size:12.5px;color:#475569;padding:1px 0}
.reason-list li::marker{color:#1e293b}
.intg-desc{font-size:13px;color:#475569;line-height:1.5}

/* ---------- Data Consistency ---------- */
.conf{display:grid;grid-template-columns:minmax(170px,230px) minmax(0,1fr);column-gap:28px;padding:14px 18px;scroll-margin-top:150px;transition:background .25s,box-shadow .25s}
.conf.flash{background:rgba(230,27,132,.06);box-shadow:inset 3px 0 0 #E61B84}
.conf.is-done{align-items:center;padding-top:11px;padding-bottom:11px}
.conf-side,.conf-main{min-width:0}
.conf-label{font-size:13.5px;font-weight:600;color:#1e293b;line-height:1.4}
.conf-tag{font-size:10px;font-weight:700;color:#b45309;text-transform:uppercase;letter-spacing:.02em;line-height:1.5;margin-top:2px}
.conf-why{font-size:12px;color:#64748b;line-height:1.45;margin-top:1px}
.conf-why::first-letter{text-transform:uppercase}
.conf-pill{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:1px 7px}
.conf-ok{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#16a34a;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:1px}
.opt{display:grid;grid-template-columns:16px minmax(0,270px) minmax(0,1fr);align-items:center;column-gap:10px;padding:5px 8px;margin:0 -8px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.45;transition:background .15s}
.opt:hover{background:#f8fafc}
.opt.sel{background:rgba(230,27,132,.06)}
.opt input{accent-color:#E61B84;margin:0}
.opt-val{font-weight:600;color:#0f172a;overflow-wrap:anywhere}
.opt-src{font-size:12px;color:#64748b;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.suggested{font-size:9.5px;font-weight:700;color:#0369a1;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:1px 7px;line-height:1.5}
.conf-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.conf-input{font-size:12.5px;padding:5px 10px;border-radius:7px;border:1px solid #cbd5e1;flex:0 1 260px;min-width:0;background:#fff}
.conf-input:focus{outline:none;border-color:#E61B84;box-shadow:0 0 0 3px rgba(230,27,132,.12)}
.conf-btn{font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:7px;border:none;background:#2563eb;color:#fff;flex-shrink:0}
.conf-btn:disabled{background:#cbd5e1;cursor:not-allowed}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%}
.tbl th{text-align:left;padding:8px 18px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.tbl td{padding:9px 18px;font-size:12.5px;color:#0f172a;border-top:1px solid #f1f5f9;white-space:nowrap}
.tbl tbody tr:first-child td{border-top:0}
.scope-tag{font-size:10px;font-weight:700;color:#0369a1;text-transform:uppercase;letter-spacing:.3px}
.scoped-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;font-size:12.5px;color:#475569}
.scoped-row b{font-weight:600;color:#1e293b;min-width:0;overflow-wrap:anywhere}
.scope-chip{font-size:10.5px;color:#64748b;background:#fff;border:1px solid #e2e8f0;border-radius:4px;padding:1px 6px}
.scope-src{font-size:11px;color:#94a3b8}

/* ---------- Hard Stops / Warnings ---------- */
.issue{display:flex;gap:12px;padding:14px 18px}
.issue-dot{width:6px;height:6px;border-radius:50%;margin-top:8px;flex-shrink:0;background:#1e293b}
.issue-main{flex:1;min-width:0}
.issue-msg{font-size:13.5px;color:#1e293b;line-height:1.55}
.issue-fixline{font-size:13px;color:#334155;line-height:1.55;margin-top:2px}
.issue-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.tier{display:flex;flex-direction:column;gap:10px}
.tier-head{display:flex;align-items:center;gap:8px;width:100%;padding:6px 2px;background:none;border:0;text-align:left;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#0f172a;line-height:1.5}
/* The live CollapsibleSection arrow: a small triangle before the title that turns down when open. */
.tri{font-size:8px;line-height:1;color:#94a3b8;display:inline-block;flex-shrink:0;transition:transform .15s}
[aria-expanded="true"] > .tri{transform:rotate(90deg)}
button.panel-head .panel-head-text{display:flex;flex-direction:column;min-width:0}
.panel-head .rollup{margin-left:auto}
.wtabs{margin:0 0 16px}

/* ---------- Polish ---------- */
.rail-pkg{display:block;margin:14px 14px 2px;padding:12px 14px;border:1px solid rgba(230,27,132,.34);border-radius:12px;background:linear-gradient(135deg,rgba(230,27,132,.17) 0%,rgba(230,27,132,.05) 55%,rgba(230,27,132,0) 100%),#111116;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.rail-pkg-label{color:#F9A8D4}
.rail-pkg-name{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-pkg-meta{margin-top:2px}
/* Rail rhythm scales with the window height, so the list never looks sparse on a tall screen or clipped on a short one. */
.rail-nav{gap:clamp(4px,1.1vh,14px)}
.nav-group{padding:clamp(12px,2.8vh,34px) 22px 2px}
.nav-item{min-height:clamp(50px,7.2vh,76px)}
.rf-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rf-reset{margin:0;flex-shrink:0}
@media (max-height:840px){.rail-foot .rf-label{display:none}.rail-foot{padding:11px 14px 12px}}
@media (max-height:720px){.nav-item{min-height:46px}.nav-sub{display:none}}
.page-head{align-items:flex-start}
.page-head-right{padding:20px 0 0}
.conf-why::first-letter{text-transform:uppercase}

/* ---------- Responsive (after the base rules above) ---------- */
@media (max-width:900px){
  .rail-pkg,.rail-foot,.nav-group{display:none}
  .rail-nav{flex-direction:row;gap:4px;padding:8px}
  .nav-item{min-height:0;height:40px;padding:0 12px;margin:0;width:auto;gap:8px}
  .nav-item.active::before{top:auto;bottom:-8px}
  .nav-sub{display:none}
  .page-head{flex-direction:column;align-items:flex-start;gap:10px}
  .page-head-right{padding:0}
}
@media (max-width:480px){
  .page-title{font-size:21px}
  .panel-head,.panel-body,.doc-row,.conf,.issue,.scoped-row{padding-left:14px;padding-right:14px}
  .tbl th,.tbl td{padding-left:12px;padding-right:12px}
}

@media (max-width:700px){
  .conf{grid-template-columns:1fr;row-gap:8px}
  .opt{grid-template-columns:16px minmax(0,1fr)}
  .opt-src{grid-column:2}
  .conf-input{flex:1 1 140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ===================== Overview ===================== */
function gaugeSvg(idx){
  var cx = 120, cy = 118, r = 96, n = LADDER.length, gap = 3, span = 180 / n, out = "";
  function pt(a){ var rad = a * Math.PI / 180; return (cx + r * Math.cos(rad)).toFixed(2) + " " + (cy + r * Math.sin(rad)).toFixed(2); }
  for (var i = 0; i < n; i++){
    var a0 = 180 + i * span + (i ? gap / 2 : 0), a1 = 180 + (i + 1) * span - (i < n - 1 ? gap / 2 : 0);
    out += '<path d="M ' + pt(a0) + ' A ' + r + ' ' + r + ' 0 0 1 ' + pt(a1) + '" stroke="' + LADDER[i].color + '" stroke-width="18" fill="none" opacity="' + (i <= idx ? 1 : 0.16) + '"/>';
  }
  return '<svg viewBox="0 0 240 132" role="img" aria-label="Readiness: ' + LADDER[idx].name + '">' + out + '</svg>';
}
function renderOverview(){
  var idx = tierIndex(), tier = LADDER[idx], c = counts(), kd = keyDetails();

    return '<div class="ladder-row' + (i === idx ? " on" : "") + '"><i' + (i <= idx ? ' style="background:#1e293b"' : "") + '></i>' + t.name + '</div>';
  }).join("");
  var readiness = panel({ title:"Submission Readiness", right:'<span class="panel-meta" style="margin:0">Updates as you fix items</span>',
    body:'<div class="ready"><div class="gauge">' + gaugeSvg(idx) + '<div class="gauge-tier" style="color:' + tier.color + '">' + tier.name + '</div></div>' +
      '<div><div class="ready-big">' + kd.inPlace.length + ' of ' + (kd.inPlace.length + kd.missing.length) + ' key details in place</div>' +
      '<div class="ready-note">Your Submission Quality Score is calculated after forms are generated.</div><div class="ladder">' + ladder + '</div></div></div>' });
  function stat(n, open, done, color, go){
    return '<button type="button" class="stat-link' + (n ? "" : " done") + '" data-go="' + go + '"><i style="background:' + (n ? "#1e293b" : "#cbd5e1") + '"></i>' + (n ? open : done) +
      '<span class="go">' + ico("arrow", 14) + '</span></button>';
  }
  var progress = panel({ title:"Your Progress",
    body:'<div class="prog-big"><b>' + c.handled + ' of ' + c.total + '</b><span>items handled</span></div>' +
      '<div class="prog-bar"><i style="width:' + Math.round(c.handled / c.total * 100) + '%"></i></div><div class="stats">' +
      stat(c.hs, plural(c.hs, "blocker") + " left", "No blockers left", "#dc2626", "hardstops") +
      stat(c.dc, plural(c.dc, "value") + " to confirm", "All values confirmed", "#E61B84", "consistency") +

  var keys = panel({ title:"Key details", right:'<span class="panel-meta" style="margin:0">Used to calculate readiness</span>',
    body:(kd.inPlace.length ? '<div class="tier2-detail tier2-detail-ok" style="margin-top:0">Key details in place: ' + kd.inPlace.join(" · ") + '</div>' : "") +
      (kd.missing.length ? '<div class="tier2-missing">Key details missing: ' + kd.missing.join(" · ") + '</div>' : "") });
  return pageHead("overview", "Review Your Submission", "Resolve what needs your input, then continue to form selection.", badge("blue", "In Progress")) +
    '<div class="sec"><div class="ov-grid">' + readiness + progress + '</div>' + keys + '</div>';
}

/* ===================== Issue rails (live Hard Stops / Warnings) ===================== */
function statusControl(it){
  var st = state.status[it.id];
  if (!st) return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:5px">' +
    '<button type="button" class="issue-status-btn" data-status="resolved" data-id="' + it.id + '" data-tip="' + esc(ACTION_TIP.resolve) + '">Resolve</button>' +
    '<button type="button" class="issue-status-btn" data-status="dismissed" data-id="' + it.id + '" data-tip="' + esc(ACTION_TIP.dismiss) + '">Dismiss</button></div>';
  var chip = st === "resolved" ? "background:#dcfce7;color:#166534;border:1px solid #86efac" : "background:#fef3c7;color:#92400e;border:1px solid #fde68a";
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:5px"><span class="status-chip" style="' + chip + '">' + (st === "resolved" ? "Resolved" : "Dismissed") + '</span>' +
    '<button type="button" class="issue-status-btn issue-status-btn-reopen" data-status="open" data-id="' + it.id + '" data-tip="' + esc(ACTION_TIP.reopen) + '">Reopen</button></div>';
}
function issueText(message){
  var i = message.indexOf("Fix: ");
  if (i === -1) return '<div class="issue-msg">' + esc(message) + '</div>';
  var before = message.slice(0, i).replace(/\s+$/, ""), after = message.slice(i + 5);
  if (/\($/.test(before) && /\)\s*$/.test(after)) { before = before.slice(0, -1).replace(/\s+$/, ""); after = after.replace(/\)\s*$/, ""); }
  return '<div class="issue-msg">' + esc(before) + '</div><div class="issue-fixline"><strong>Fix:</strong> ' + esc(after) + '</div>';
}
function itemActions(it){
  var fixDc = it.dc && !state.dc[it.dc].confirmed, canFix = it.mode === "field" || it.mode === "schedule";
  var hint = !fixDc && !canFix && it.mode === "none"
    ? '<div class="res-hint">' + esc(it.note || "Can't be fixed by typing a value - needs a coverage decision or a form change.") + '</div>' : "";
  return hint + '<div class="issue-actions">' +
    (fixDc ? '<button type="button" class="pink-btn" data-fix-dc="' + it.dc + '"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"><path d="M2 8l4-4 4 4" stroke="#be185d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Fix in Data Consistency</button>' : "") +
    (canFix ? '<button type="button" class="pink-btn" data-open-fix="' + it.id + '">Open to fix<svg width="9" height="9" viewBox="0 0 12 12" fill="none"><path d="M3 2l4 4-4 4" stroke="#be185d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' : "") +
    statusControl(it) + '</div>';
}
function issueRow(it, tone){
  return '<div class="issue"><span class="issue-dot ' + tone + '"></span><div class="issue-main">' + issueText(messageOf(it)) + itemActions(it) + '</div></div>';
}
function foldOpen(key, defOpen){ return has(state.folds, key) ? state.folds[key] : defOpen; }
function clusterPanel(cl, tone, defOpen){
  var n = cl.items.length, key = "cl_" + tone + "_" + cl.cluster;
  /* Live defaults: a single-issue card starts open; a multi-issue warning card starts closed; hard stops start open. */
  var def = tone === "hard" ? true : (n === 1 ? true : defOpen);
  var open = foldOpen(key, def);
  var head = '<button type="button" class="panel-head" data-fold="' + key + '" data-default="' + def + '" aria-expanded="' + open + '">' +
    '<span class="tri" aria-hidden="true">&#9654;</span><span class="panel-title">' + esc(cl.cluster) + (n > 1 ? '<span class="issue-count">' + n + '</span>' : "") + '</span>' + rollup(cl.items) + '</button>';
  return '<section class="panel">' + head + (open ? '<div class="panel-rows">' + cl.items.map(function(it){ return issueRow(it, tone); }).join("") + '</div>' : "") + '</section>';
}
function rollup(items){
  var done = items.filter(function(i){ return !!state.status[i.id]; }).length;
  return done ? '<span class="rollup">' + done + ' of ' + items.length + ' handled</span>' : "";
}
function renderHardStops(){
  var present = hardPresent();
  var body = present.length ? clustersOf(present).map(function(cl){ return clusterPanel(cl, "hard", true); }).join("")
    : emptyState("No hard stops remain.", "Nothing is holding your score at 60.");
  return pageHead("hardstops", "Hard Stops", "Required before submission - Caps your Submission Quality Score (SQS) at 60", progressText(present)) +
    '<div class="sec">' + body + '</div>';
}
function importantClusters(present){
  var cls = clustersOf(present);
  cls.sort(function(a, b){ return IMPORTANT_ORDER.indexOf(a.cluster) - IMPORTANT_ORDER.indexOf(b.cluster); });
  return cls.slice(0, 3);
}
function renderWarnings(){
  var present = warnPresent(), wt = state.wtab, imp = importantClusters(present);
  var tabs = [{ id:"all", label:"All", n:present.length }, { id:"important", label:"Important", n:imp.length }].concat(TIERS.map(function(t){
    return { id:t.id, label:t.label, n:present.filter(function(w){ return w.tier === t.id; }).length };
  }));
  var tabBar = '<div class="wtabs" role="group" aria-label="Warning groups">' + tabs.map(function(t){
    return '<button type="button" class="wtab' + (wt === t.id ? " on" : "") + '" aria-pressed="' + (wt === t.id) + '" data-wtab="' + t.id + '">' + t.label + '<span class="issue-count">' + t.n + '</span></button>';
  }).join("") + '</div>';
  function importantPanel(){
    if (!imp.length) return "";
    var key = "imp_" + wt, open = foldOpen(key, true);
    var head = '<button type="button" class="panel-head" data-fold="' + key + '" data-default="true" aria-expanded="' + open + '">' +
      '<span class="tri" aria-hidden="true">&#9654;</span><span class="panel-head-text"><span class="panel-title" style="color:#E61B84">Important</span>' +
      '<span class="panel-meta">The warnings to look at first. Their actions are in the groups below.</span></span></button>';
    var rows = imp.map(function(cl){
      var m = messageOf(cl.items[0]);
      return '<div class="issue"><span class="issue-dot soft"></span><div class="issue-main">' + issueText(cl.items.length > 1 ? m + " (+" + (cl.items.length - 1) + " related)" : m) + '</div></div>';
    }).join("");
    return '<section class="panel">' + head + (open ? '<div class="panel-rows">' + rows + '</div>' : "") + '</section>';
  }
  function tierBlock(t, defOpen){
    var items = present.filter(function(w){ return w.tier === t.id; });
    if (!items.length) return "";
    var key = "tier_" + wt + "_" + t.id, open = foldOpen(key, defOpen);
    var head = '<button type="button" class="tier-head" data-fold="' + key + '" data-default="' + defOpen + '" aria-expanded="' + open + '">' +
      '<span class="tri" aria-hidden="true">&#9654;</span>' + esc(t.label) + '<span class="issue-count">' + items.length + '</span></button>';
    return '<div class="tier">' + head + (open ? clustersOf(items).map(function(cl){ return clusterPanel(cl, "soft", false); }).join("") : "") + '</div>';
  }
  var body;
  if (!present.length) body = emptyState("No warnings remain.", "Nothing is holding your score at 85.");
  else if (wt === "all") body = importantPanel() + TIERS.map(function(t){ return tierBlock(t, t.id === "required"); }).join("");
  else if (wt === "important") body = importantPanel() || emptyState("Nothing to highlight.");
  else {
    var t = TIERS.filter(function(x){ return x.id === wt; })[0];
    body = tierBlock(t, true) || emptyState("No warnings in this group.");
  }
  return pageHead("warnings", "Warnings", "Caps your Submission Quality Score (SQS) at 85", progressText(present)) + tabBar + '<div class="sec">' + body + '</div>';
}

  }
  var label = w.mode === "schedule" ? "Update the schedule" : "Enter the correct value";
  root.innerHTML = '<div class="overlay" data-m-backdrop="1"><div class="mcard' + (w.mode === "schedule" ? " wide" : "") + (opening ? " anim" : "") + '" role="dialog" aria-modal="true" aria-label="' + label + '">' +
    '<div style="padding:18px 20px 12px;border-bottom:1px solid #f1f5f9"><div style="display:flex;align-items:flex-start;gap:10px"><div style="flex:1;min-width:0">' +
      '<div style="font-size:10px;font-weight:700;color:#E61B84;text-transform:uppercase;letter-spacing:.06em">' + label + '</div>' +
      ((w.forms || []).length ? '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">' + w.forms.map(function(f){ return '<span style="font-size:9.5px;font-weight:700;color:#9d174d;background:#fce7f3;border:1px solid #f9a8d4;border-radius:10px;padding:1px 7px">' + f + '</span>'; }).join("") + '</div>' : "") + '</div>' +
      '<button type="button" class="m-close" data-m-close="1" aria-label="Close">&times;</button></div>' +
      '<div style="font-size:13px;color:#334155;line-height:1.5;margin-top:10px">' + esc(messageOf(w)) + '</div></div>' +
    '<div style="padding:16px 20px">' + body + (modal.err ? '<div class="m-err" role="alert">' + esc(modal.err) + '</div>' : "") + '</div>' +
    '<div style="padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid #f1f5f9">' +
      '<button type="button" class="m-ghost" data-m-close="1">Cancel</button>' +
      '<button type="button" class="m-primary" data-m-apply="1">Apply</button></div></div></div>';
  if (opening) { var f = root.querySelector(".m-input, .st-cell, [data-m-addrow]"); if (f) f.focus(); }
}
function closeModal(){
  var id = modal && modal.id; modal = null; renderModal();
  var back = id && document.querySelector('[data-open-fix="' + id + '"]');
  if (back) back.focus({ preventScroll:true });
}
function applyModal(){
  var w = WARNINGS.filter(function(x){ return x.id === modal.id; })[0];
  if (w.mode === "schedule") {
    var rows = modal.rows.filter(function(r){ return DRIVER_COLS.some(function(c){ return (r[c.key] || "").trim(); }); });
    var prevRows = state.drivers;
    state.drivers = rows; modal = null; renderModal(); render(); focusNextFix();
    toast(isFixed(w) ? "Schedule saved. The checks were re-run." : "Schedule saved. It is still empty.", function(){ state.drivers = prevRows; });
    return;
  }
  var changes = {};
  Object.keys(modal.touched).forEach(function(k){ var v = (modal.values[k] || "").trim(); if (v) changes[k] = v; });
  if (!Object.keys(changes).length) {
    modal.err = "Enter at least one value."; renderModal();
    var first = document.querySelector("#modalRoot .m-input"); if (first) first.focus();
    return;
  }
  var prev = {};
  Object.keys(changes).forEach(function(k){ prev[k] = has(state.facts, k) ? state.facts[k] : null; state.facts[k] = changes[k]; });
  modal = null; renderModal(); render();
  if (!focusFirstEl('[data-open-fix="' + w.id + '"]')) focusNextFix();
  var undo = function(){ Object.keys(prev).forEach(function(k){ if (prev[k] == null) delete state.facts[k]; else state.facts[k] = prev[k]; }); };
  toast(isFixed(w) ? "Applied. The checks were re-run." : (w.id === "w_carrier_cope" ? "Saved. Still missing: " + carrierCopeMissing().join(", ") + "." : "Saved. The checks were re-run."), undo);
}
function focusFirstEl(sel){ var el = document.querySelector(sel); if (el) el.focus({ preventScroll:true }); return !!el; }
function focusNextFix(){ return focusFirstEl("#panes [data-open-fix]") || focusFirstEl("#panes [data-status]"); }

/* ===================== Render + routing ===================== */
function syncFooter(){
  var f = document.getElementById("footer");
  document.documentElement.style.setProperty("--ftr", (f.style.display === "none" ? 0 : f.offsetHeight) + "px");
}
var RENDER = { overview:renderOverview, documents:renderDocuments, integrity:renderIntegrity, consistency:renderConsistency, hardstops:renderHardStops, warnings:renderWarnings };
var lastView = null;
function focusKey(){
  var a = document.activeElement;
  if (!a || a === document.body || !a.closest) return null;
  var scope = a.closest("#nav") ? "#nav" : (a.closest("#panes") ? "#panes" : null);
  if (!scope) return null;
  var sel = [].slice.call(a.attributes).filter(function(x){ return x.name.indexOf("data-") === 0 && x.name !== "data-tip"; })
    .map(function(x){ return "[" + x.name + '="' + x.value.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"]'; }).join("");
  return sel ? scope + " " + a.tagName.toLowerCase() + sel : null;
}
function render(){
  hideTip();
  var keep = focusKey(), gate = state.stage === "gate";
  var view = gate ? "gate" : state.tab + (state.tab === "warnings" ? "/" + state.wtab : "");
  var changed = view !== lastView; lastView = view;
  document.getElementById("shell").classList.toggle("no-rail", gate);
  document.getElementById("footer").style.display = gate ? "none" : "";
  document.getElementById("panes").innerHTML = '<div class="' + (gate ? "" : "modal-step modal-step-wide") + (changed ? " pane-anim" : "") + '">' + (gate ? renderGate() : RENDER[state.tab]()) + '</div>';
  if (!gate) renderNav();
  /* Every open item counts: values to confirm, hard stops and warnings (the same total as the rail and Overview). */
  var openN = counts().open, note = document.getElementById("footerNote");
  note.textContent = openN ? plural(openN, "item") + " still need" + (openN === 1 ? "s" : "") + " your input. You can continue and come back." : "";
  note.style.display = openN ? "" : "none";
  syncFooter();
  save();
  if (keep) { var el = document.querySelector(keep); if (el) el.focus({ preventScroll:true }); }
  if (changed && !gate && window.innerWidth <= 900) {
    /* Centre the active tab in the phone bar by scrolling the BAR only - scrollIntoView also nudged the page. */
    var bar = document.getElementById("nav"), a = bar.querySelector(".nav-item.active");
    if (a) bar.scrollLeft = Math.max(0, a.offsetLeft - (bar.clientWidth - a.offsetWidth) / 2);
  }
}
var pending = null;
function go(hash, opts){
  pending = opts || null;
  if (location.hash === hash) route(); else location.hash = hash;
}
function route(){
  var parts = location.hash.replace(/^#/, "").split("/"), p = pending || {}; pending = null;
  if (state.stage === "gate") {
    if (location.hash !== "#gate") history.replaceState(null, "", "#gate");
  } else {
    var tab = TABS.indexOf(parts[0]) !== -1 ? parts[0] : "overview";
    state.tab = tab;
    if (tab === "warnings") state.wtab = WTABS.indexOf(parts[1]) !== -1 ? parts[1] : "all";
    var canonical = "#" + tab + (tab === "warnings" && state.wtab !== "all" ? "/" + state.wtab : "");
    if (location.hash !== canonical) history.replaceState(null, "", canonical);
  }
  render();
  if (p.dc) {
    var row = document.getElementById("dc-field-" + p.dc);
    if (row) {
      row.scrollIntoView({ behavior:"smooth", block:"center" });
      row.classList.add("flash");
      setTimeout(function(){ row.classList.remove("flash"); }, 1800);
      var r = row.querySelector("input"); if (r) r.focus({ preventScroll:true });
    }
  } else if (p.top !== false) {
    window.scrollTo(0, 0);
  }
}
window.addEventListener("hashchange", route);

/* ===================== Tooltip (live TipBubble look) ===================== */
var tipEl = document.getElementById("tip"), tipFor = null;
function showTip(el){
  var text = el.getAttribute("data-tip"); if (!text) return;
  tipFor = el; tipEl.textContent = text;
  var r = el.getBoundingClientRect(), w = Math.min(220, window.innerWidth - 16);
  var left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8));
  tipEl.style.width = w + "px"; tipEl.style.left = left + "px";
  if (window.innerHeight - r.bottom < 120) { tipEl.style.top = "auto"; tipEl.style.bottom = (window.innerHeight - r.top + 6) + "px"; }
  else { tipEl.style.bottom = "auto"; tipEl.style.top = (r.bottom + 6) + "px"; }
  tipEl.classList.add("show");
}
function hideTip(){ tipFor = null; tipEl.classList.remove("show"); }
document.addEventListener("mouseover", function(e){ var t = e.target.closest && e.target.closest("[data-tip]"); if (t && t !== tipFor) showTip(t); else if (!t && tipFor) hideTip(); });
document.addEventListener("focusin", function(e){ var t = e.target.closest && e.target.closest("[data-tip]"); if (t) showTip(t); else hideTip(); });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, { passive:true });

/* ===================== Toast ===================== */
var toastTimer = null;
function toast(msg, undo){
  var el = document.getElementById("toast");
  el.innerHTML = "<span>" + esc(msg) + "</span>" + (undo ? '<button type="button" id="toastUndo">Undo</button>' : "");
  el.classList.add("show");
  if (undo) document.getElementById("toastUndo").onclick = function(){ undo(); el.classList.remove("show"); render(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 3600);
}

/* ===================== Header: hide on scroll down, show on scroll up (live Header.jsx thresholds) ===================== */
var header = document.getElementById("appHeader"), hdrHidden = false, lastY = window.scrollY, lockUntil = 0;
function syncHeader(){
  var h = header.offsetHeight;
  document.documentElement.style.setProperty("--hdr-h", h + "px");
  document.documentElement.style.setProperty("--hdr-offset", (hdrHidden ? 0 : h) + "px");
}
window.addEventListener("scroll", function(){
  var y = window.scrollY, d = y - lastY;
  if (Math.abs(d) < 4) return;
  lastY = y;
  var want = hdrHidden;
  if (!hdrHidden && d > 6 && y > 80) want = true; else if (hdrHidden && (d < -40 || y <= 0)) want = false;
  if (want === hdrHidden) return;
  var now = performance.now(); if (now < lockUntil) return; lockUntil = now + 400;
  hdrHidden = want; header.classList.toggle("hidden", want); syncHeader();
}, { passive:true });
window.addEventListener("resize", function(){ syncHeader(); syncFooter(); });

/* ===================== Actions ===================== */
function confirmDc(id){
  var s = state.dc[id], v = (s.pick || "").trim();
  if (!v) { toast("Enter or select a value to confirm."); return; }
  s.confirmed = v; render();
  focusFirstEl("#panes [data-dc-radio]");
  var c = CONFLICTS.filter(function(x){ return x.id === id; })[0];
  toast(c.label + " confirmed. Everything this value affects was updated.", function(){ s.confirmed = null; });
}
function setStatus(id, st){ if (st === "open") delete state.status[id]; else state.status[id] = st; render(); }

document.addEventListener("click", function(e){
  var bd = e.target.closest("[data-m-backdrop]");
  if (bd && e.target === bd) { closeModal(); return; }
  var t = e.target.closest("button, [data-toast]");
  if (!t) return;
  var d = t.dataset;

  if (d.mClose) { closeModal(); return; }
  if (d.mApply) { applyModal(); return; }
  if (d.mAddrow) { var blank = {}; DRIVER_COLS.forEach(function(c){ blank[c.key] = ""; }); modal.rows.push(blank); renderModal(); focusFirstEl('[data-m-cell="' + (modal.rows.length - 1) + '"]'); return; }
  if (d.mRemove != null) { modal.rows.splice(Number(d.mRemove), 1); renderModal(); focusFirstEl("[data-m-addrow]"); return; }

  if (d.go) { go("#" + d.go + (d.go === "warnings" && state.wtab !== "all" ? "/" + state.wtab : "")); return; }
  if (d.wtab) { go("#warnings" + (d.wtab === "all" ? "" : "/" + d.wtab), { top:false }); return; }
  if (d.fold) { var cur = has(state.folds, d.fold) ? state.folds[d.fold] : d.default === "true"; state.folds[d.fold] = !cur; render(); return; }
  if (d.gate) {
    if (d.gate === "remove") { toast("Mockup: removes the selected documents and re-runs the integrity check."); return; }
    if (d.gate === "upload") { toast("Mockup: returns to the upload screen."); return; }
    state.stage = "review"; state.tab = "overview";
    go("#overview");
    toast(d.gate === "continue" ? "Acknowledged. Continuing with all documents as one submission." : "Mockup: split into one submission per insured. Continuing with the first.");
    return;
  }
  if (d.dcConfirm) { confirmDc(d.dcConfirm); return; }
  if (d.fixDc) { go("#consistency", { dc:d.fixDc }); return; }
  if (d.openFix) { openModal(d.openFix); return; }
  if (d.status) { var sid = d.id, sst = d.status; setStatus(sid, sst); focusFirstEl(sst === "open" ? '[data-status="resolved"][data-id="' + sid + '"]' : '[data-status="open"][data-id="' + sid + '"]'); return; }
  if (d.doc) {
    var st = state.docs[d.doc];
    if (d.docAct === "review") { toast("Mockup: shows what Primble read from " + DOCS.filter(function(x){ return x.id === d.doc; })[0].name + "."); return; }
    if (d.docAct === "exclude") { st.excluded = true; render(); focusFirstEl('[data-doc="' + d.doc + '"][data-doc-act="include"]'); toast("Document excluded from scoring.", function(){ st.excluded = false; }); return; }
    if (d.docAct === "include") { st.excluded = false; render(); focusFirstEl('[data-doc="' + d.doc + '"][data-doc-act="exclude"]'); return; }
    if (d.docAct === "supporting") { st.supporting = !st.supporting; render(); focusFirstEl('[data-doc="' + d.doc + '"][data-doc-act="supporting"]'); return; }
  }
  if (d.toast) { toast(d.toast); return; }
  if (t.id === "continueBtn") { toast("Mockup: form selection opens here."); return; }
  if (t.id === "resetBtn") {
    try { localStorage.removeItem(STORE_KEY); } catch (err) {}
    state = freshState(); lastView = null; modal = null; renderModal(); go("#gate"); toast("Demo reset."); return;
  }
});

function onField(e){
  var el = e.target, d = el.dataset || {};
  if (d.gateDoc) { state.gateRemove[d.gateDoc] = el.checked; render(); return; }
  if (d.dcRadio && e.type === "change") {
    state.dc[d.dcRadio].pick = el.value;
    var rrow = document.getElementById("dc-field-" + d.dcRadio);
    rrow.querySelectorAll("[data-dc-radio]").forEach(function(r){ r.closest(".opt").classList.toggle("sel", r.checked); });
    rrow.querySelector("[data-dc-text]").value = el.value;
    rrow.querySelector("[data-dc-confirm]").disabled = !el.value.trim();
    save(); return;
  }
  if (d.dcText) {
    var s = state.dc[d.dcText]; s.pick = el.value;
    var row = document.getElementById("dc-field-" + d.dcText);
    row.querySelectorAll("[data-dc-radio]").forEach(function(r){ r.checked = r.value === el.value; r.closest(".opt").classList.toggle("sel", r.checked); });
    row.querySelector("[data-dc-confirm]").disabled = !el.value.trim();
    save(); return;
  }
  if (d.docType && e.type === "change") {
    var ds = state.docs[d.docType]; ds.type = el.value; ds.overridden = true; render();
    toast("Document type updated. Scoring and recommendations were re-run."); return;
  }
  if (modal && d.mField) {
    modal.touched[d.mField] = true;
    if (d.kind === "select") {
      if (e.type !== "change") return;
      var isOther = el.value === "Other";
      modal.other[d.mField] = isOther; modal.values[d.mField] = isOther ? "" : el.value; modal.err = "";
      renderModal();
      focusFirstEl(isOther ? '[data-m-field="' + d.mField + '"][data-kind="other"]' : '[data-m-field="' + d.mField + '"][data-kind="select"]');
      return;
    }
    modal.values[d.mField] = el.value;
    if (modal.err) { modal.err = ""; var er = document.querySelector("#modalRoot .m-err"); if (er) er.remove(); }
    return;
  }
  if (modal && d.mCell != null) {
    modal.rows[Number(d.mCell)][d.col] = el.value;
    var filled = modal.rows.filter(function(r){ return DRIVER_COLS.some(function(c){ return (r[c.key] || "").trim(); }); }).length;
    var cnt = document.querySelector("#modalRoot .st-count"); if (cnt) cnt.textContent = filled + " " + (filled === 1 ? "driver" : "drivers");
  }
}
document.addEventListener("input", onField);
document.addEventListener("change", onField);
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") { hideTip(); if (modal) { closeModal(); return; } }
  if (e.key !== "Enter") return;
  var d = e.target.dataset || {};
  if (d.dcText) { e.preventDefault(); confirmDc(d.dcText); return; }
  if (modal && (d.mField || d.mCell != null) && e.target.tagName === "INPUT") {
    e.preventDefault(); applyModal();
  }
  if (e.target.matches && e.target.matches('[role="button"][data-tip]')) { e.preventDefault(); tipFor === e.target ? hideTip() : showTip(e.target); }
});
/* Keep keyboard focus inside the dialog while it is open. */
document.addEventListener("keydown", function(e){
  if (e.key !== "Tab" || !modal) return;
  var f = [].slice.call(document.querySelectorAll("#modalRoot button:not([disabled]), #modalRoot input, #modalRoot select"));
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* ===================== Init ===================== */
try { history.scrollRestoration = "manual"; } catch (e) {}
syncHeader();
if (!location.hash) history.replaceState(null, "", state.stage === "gate" ? "#gate" : "#" + state.tab + (state.tab === "warnings" && state.wtab !== "all" ? "/" + state.wtab : ""));
route();
})();
</script>
</body>
</html>
