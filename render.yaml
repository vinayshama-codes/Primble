services:
  - type: web
    name: acordly-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app -w ${WEB_CONCURRENCY:-2} -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:${PORT:-8000} --timeout 600 --keep-alive 65 --graceful-timeout 30 --worker-tmp-dir /dev/shm"
    healthCheckPath: /api/health
    envVars:
      # KEEP THIS FILE EQUAL TO THE DASHBOARD (27 Sep 2026). It said async and
      # easyocr while production ran synchronously on Google Vision, and that
      # mismatch misdirected a whole diagnosis. The dashboard is what runs.
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JOB_QUEUE_BACKEND
        value: db
      # Generation runs inside this web service, exactly as on localhost. true
      # hands it to acordly-worker below instead - same code, but then the
      # worker must be running with the same settings as this service.
      - key: ENABLE_ASYNC_PROCESSING
        value: "false"
      # Only this service (main.py) can start the nightly scheduler; worker.py
      # never does. false = retention clean-up, audit-log retention, the daily
      # payment lifecycle and questionnaire reminders run NOWHERE. Turning it
      # on is an owner decision (it starts billing lock-outs and reminder
      # e-mails); safe to enable only while WEB_CONCURRENCY is 1.
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5.4-mini
      - key: GPT_MODEL
        value: gpt-5.4-mini
      # LLM_REQUEST_TIMEOUT is deliberately NOT set (owner, 27 Sep 2026): the
      # code default, 120 s, applies. Localhost must not set it either, or a
      # long document call times out here and not there.
      - key: OPENAI_MAX_CONCURRENT
        value: "8"
      # 0 = keep the declarations index after generation (owner, 27 Sep 2026):
      # later re-fills and re-scores keep their evidence, and client runs can
      # be diagnosed. The documents' full text is stored in the same row anyway.
      - key: PURGE_DEC_INDEX_AFTER_GENERATION
        value: "0"
      - key: MAX_CONCURRENT_HEAVY_OPS
        value: "8"
      # GLOBAL (Redis-distributed) cap on in-flight OpenAI chat completions.
      # All web workers + the background worker share this single budget, so
      # the number does NOT multiply by WEB_CONCURRENCY any more.
      # Tier 1 (500 RPM, ~1-3 s/call): 15 is safe for 3 concurrent demo users.
      # Tier 2 (5,000 RPM): bump to 40-50 in the dashboard, no code change.
      # Tier 3 (15,000 RPM): 100+.
      - key: LLM_MAX_CONCURRENT
        value: "15"
      # Max seconds a request will wait for a free LLM slot before raising.
      # 90s absorbs Tier 1 bursts without prematurely failing user requests.
      - key: LLM_ACQUIRE_TIMEOUT
        value: "90"
      - key: DB_POOL_MIN
        value: "2"
      # Bumped from 10 → 20: each in-flight heavy job can hold a connection
      # for 60-120s during LLM calls, so 8 heavy slots × ~1.5 connections/job
      # ≈ 12 needed, +6 headroom for status reads. Stays well under Supabase
      # Pro's 500-connection cap.
      - key: DB_POOL_MAX
        value: "20"
      # Optional: point this at Supabase's session-mode pooler (port 5432)
      # to enable PostgreSQL LISTEN/NOTIFY for instant worker wake-up. The
      # main DATABASE_URL should stay on transaction mode (port 6543).
      - key: DATABASE_URL_DIRECT
        sync: false
      # Google Vision is the only OCR the code ships (any other value falls
      # back to it); easyocr is not even in requirements.txt.
      - key: OCR_PROVIDER
        value: google
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Async upload staging uses Supabase Storage (S3-compatible API — no AWS).
      # STORAGE_ENDPOINT, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY, STORAGE_BUCKET
      # are set as Render dashboard secrets (sync: false above) on both web + worker.
      # CRITICAL: Ensure DATABASE_URL points to a Render Postgres Starter plan ($7/mo) or higher.
      # The free Postgres plan expires after 90 days and will cause DATA LOSS.

  # Used ONLY when the web service's ENABLE_ASYNC_PROCESSING is true. With it
  # false (production, 27 Sep 2026) this service receives no generation work -
  # suspend it: it costs money, and a worker polling the jobs table can claim a
  # job the web service has just created. If async is ever turned on, give it
  # the web service's model / OCR / timeout / purge settings first.
  - type: worker
    name: acordly-worker
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python worker.py"
    numInstances: 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JOB_QUEUE_BACKEND
        value: db
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SCHEDULER_ENABLED
        value: "true"
      # Safety-net interval; with LISTEN/NOTIFY enabled the worker normally
      # dispatches within milliseconds of enqueue. This poll only catches
      # the rare window where the LISTEN connection is reconnecting and
      # the periodic stuck-job watchdog sweep.
      - key: WORKER_POLL_INTERVAL
        value: "5"
      - key: WORKER_MAX_JOBS_PER_CYCLE
        value: "5"
      - key: MAX_CONCURRENT_HEAVY_OPS
        value: "4"
      # Same GLOBAL Redis-distributed cap as the web service. Keep both
      # processes set to the SAME value — they share the budget, they don't
      # each get their own. Tier 1 = 10; Tier 2 = 40-50.
      - key: LLM_MAX_CONCURRENT
        value: "10"
      - key: LLM_ACQUIRE_TIMEOUT
        value: "90"
      - key: WORKER_MAX_JOB_RETRIES
        value: "5"
      - key: WORKER_FORM_GEN_CONCURRENCY
        value: "4"
      # Watchdog sweep interval (seconds). Every 5 minutes the worker scans
      # for jobs stuck in 'processing' beyond STUCK_JOB_THRESHOLD_MINUTES
      # and resets them to 'pending' so they get reprocessed.
      - key: WORKER_WATCHDOG_INTERVAL
        value: "300"
      - key: STUCK_JOB_THRESHOLD_MINUTES
        value: "30"
      - key: DB_POOL_MIN
        value: "2"
      - key: DB_POOL_MAX
        value: "20"
      # Session-mode (port 5432) URL for the LISTEN/NOTIFY connection.
      # Required because PgBouncer transaction mode does not pass NOTIFY
      # through. If unset, the worker falls back to pure polling.
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: OCR_PROVIDER
        value: google
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-5.4-mini
      - key: GPT_MODEL
        value: gpt-5.4-mini
      - key: PURGE_DEC_INDEX_AFTER_GENERATION
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
